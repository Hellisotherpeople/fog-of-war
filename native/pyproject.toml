[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fow-native"
version = "0.2.0"
description = "Optional exact native simulation kernels for Fog of War"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
module-name = "_fow_native"
bindings = "pyo3"
